name: 问题反馈
description: 报告日文遗漏、错译、显示异常或游戏流程问题
title: "[v0.1] "
body:
  - type: input
    id: version
    attributes:
      label: 汉化版本与补丁格式
      placeholder: v0.1，BPS
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: 模拟器及版本
      placeholder: Snes9x 1.63
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 地点、人物、界面或技能名称
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图与补充信息
      description: 请不要上传ROM；旧即时档请先关闭并重开界面排除缓存。
